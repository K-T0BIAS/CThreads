name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install CMake, Ninja, package
        run: |
          python -m pip install -U pip
          python -m pip install cmake ninja
          python -m pip install -e ".[test]"

      - name: Pytest
        run: python -m pytest tests/ -q

  # Compile-smokes the Vulkan path (CTHREADS_GPU=ON). Live device tests still skip
  # when no ICD is present; the goal is to catch header / glslang / link breakage.
  test-gpu:
    name: test-gpu (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Vulkan headers (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev vulkan-tools

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.3.296.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Install CMake, Ninja, package (GPU ON, Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install -U pip
          python -m pip install cmake ninja
          export CMAKE_ARGS="-DCTHREADS_GPU=ON"
          python -m pip install -e ".[test]"

      - name: Install CMake, Ninja, package (GPU ON, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install cmake ninja
          $env:CMAKE_ARGS = "-DCTHREADS_GPU=ON"
          python -m pip install -e ".[test]"

      - name: Assert GPU extension linked
        run: |
          python -c "from cthreads import _ext, gpu; assert hasattr(_ext, 'gpu'), 'CTHREADS_GPU build missing _ext.gpu'; print('available=', gpu.available())"

      - name: Pytest (GPU build; device tests skip if no ICD)
        run: python -m pytest tests/ -q
