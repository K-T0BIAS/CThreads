name: Release

# Production PyPI: only when you click Publish on a GitHub Release.
# Manual "Run workflow" always targets TestPyPI, never PyPI.
#
# Artifacts:
#   - cthreads          CPU wheels + sdist  (CTHREADS_GPU=OFF)
#   - cthreads-gpu      GPU wheels          (CTHREADS_GPU=ON)
# Users: pip install cthreads  OR  pip install 'cthreads[gpu]'  (pulls cthreads-gpu)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test
        run: |
          python -m pip install -U pip cmake ninja
          python -m pip install -e ".[test]"
          python -m pytest tests/ -q

  test-gpu:
    name: test-gpu (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Vulkan headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev

      - name: Install and test (GPU ON)
        run: |
          python -m pip install -U pip cmake ninja
          export CMAKE_ARGS="-DCTHREADS_GPU=ON"
          python -m pip install -e ".[test]"
          python - <<'PY'
          from cthreads import _ext
          assert hasattr(_ext, "gpu"), "CTHREADS_GPU build missing _ext.gpu"
          PY
          python -m pytest tests/ -q

  check-version:
    name: tag matches pyproject
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare release tag to project.version and [gpu] pin
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import sys
          import tomllib

          tag = os.environ["TAG"].removeprefix("v")
          text = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          ver = tomllib.loads(text)["project"]["version"]
          if tag != ver:
              print(f"GitHub tag version {tag!r} != pyproject.toml version {ver!r}")
              sys.exit(1)
          m = re.search(r'gpu\s*=\s*\["cthreads-gpu==([^"]+)"\]', text)
          if not m:
              print("missing [project.optional-dependencies] gpu = [\"cthreads-gpu==...\"]")
              sys.exit(1)
          if m.group(1) != ver:
              print(
                  f"optional gpu pin cthreads-gpu=={m.group(1)!r} "
                  f"!= project.version {ver!r}"
              )
              sys.exit(1)
          print(f"version ok: {ver} (gpu extra pin matches)")
          PY

  build-sdist:
    name: sdist
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          python -m pip install -U pip build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  build-wheels:
    name: wheels-cpu (${{ matrix.os }})
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU wheels
        uses: pypa/cibuildwheel@v4.2.0
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build-wheels-gpu:
    name: wheels-gpu (${{ matrix.os }})
    needs: [test-gpu]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan headers (Ubuntu host; manylinux uses before-all)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.3.296.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Retarget project name to cthreads-gpu
        run: python scripts/retarget_gpu_wheel.py

      - name: Build GPU wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          # Headers only at build time; loader is resolved at runtime.
          CIBW_ENVIRONMENT: CMAKE_ARGS=-DCTHREADS_GPU=ON
          CIBW_BEFORE_ALL_LINUX: |
            set -eux
            if command -v dnf >/dev/null 2>&1; then
              dnf install -y vulkan-headers vulkan-loader-devel git
            else
              yum install -y vulkan-headers vulkan-loader-devel git
            fi
          # glslang FetchContent makes this slower than CPU wheels.
          CIBW_BUILD_VERBOSITY: 1

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-gpu-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish-pypi:
    name: publish to PyPI
    needs:
      - test
      - test-gpu
      - check-version
      - build-sdist
      - build-wheels
      - build-wheels-gpu
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cthreads
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Show artifacts
        run: ls -la dist
      # Uploads both cthreads and cthreads-gpu wheels. Configure Trusted
      # Publishing for BOTH PyPI projects (same workflow: release.yml).
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: publish to TestPyPI
    needs:
      - test
      - test-gpu
      - build-sdist
      - build-wheels
      - build-wheels-gpu
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/cthreads
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Show artifacts
        run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
